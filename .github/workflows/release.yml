name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Installs, checks and builds the gem with no publish credential in reach,
  # so a compromised dependency or build step cannot mint one.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads .ruby-version.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      # The tag must name the version being published.
      - name: Check the tag matches Blinkstick::VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(ruby -Ilib -rblinkstick/version -e 'print Blinkstick::VERSION')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Blinkstick::VERSION $version"
            exit 1
          fi
      # Build the GitHub release notes here, before anything is published, so
      # a tag without a CHANGELOG section stops the release instead of
      # failing after rubygems.org already has the gem.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          if ! sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1
      # CI checks, the same task as ci.yml.
      - run: bundle exec rake
      - run: gem build ruby-blinkstick.gemspec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.gem"
          if-no-files-found: error
          retention-days: 1

  # Publishes the gem the build job checked. It runs no repository code and
  # installs nothing, so the OIDC token only ever meets rubygems.org itself.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The rubygems environment only accepts v* tags, and the rubygems.org
    # trusted publisher names it, so no other run can mint a publish
    # credential.
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # No checkout, so there is no .ruby-version to read, and no Bundler:
      # gem push needs nothing from the Gemfile.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
      # Trusted publishing is the default when no token or role is given: the
      # action swaps the job's OIDC token for a short-lived rubygems.org key.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish the expected gem
        # Publish exactly the gem this tag should have produced, so a stray
        # file in the artifact can never be published instead.
        run: |
          file="ruby-blinkstick-${GITHUB_REF_NAME#v}.gem"
          if [ ! -f "$file" ]; then
            echo "::error::expected $file was not found"
            exit 1
          fi
          for f in ./*.gem; do
            if [ "$f" != "./$file" ]; then
              echo "::error::unexpected gem $f"
              exit 1
            fi
          done
          gem push "./$file"

  # Creates the GitHub release once rubygems.org has the gem, with the notes
  # the build job extracted. There is no checkout and nothing is installed,
  # so this job's write token reaches only the gh CLI that ships on the
  # runner.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A published release for the tag, such as one made by hand, is left
        # alone, so a re-run never overwrites it. gh does not see drafts, so
        # a draft for the tag would get a second release beside it.
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists, leaving it as it is"
            exit 0
          fi
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file release-notes.md
